# Figure contract: Figure 2 — external performance, decision mechanism, provenance.
#
# REVISION R31 (2026-10-28). The figure was rebuilt because the paper's primary
# system-level claim moved from the internal NHANES matrix (now a development
# matrix with zero contamination-free positives) to the external KNHANES matrix
# and its revision-free subset.
#
# Source of truth:
#   panels a, c, d -> outputs/confirmatory/r31_holdout.json   (P1/P2/P3)
#   panel b        -> outputs/confirmatory/fused_system_summary.json (gate_distribution)
#   the CSV is generated by scripts/build_figure2_source_data.py

figure_id: figure2_performance
title: "External performance, decision mechanism, and provenance of the positives"
figure_number: 2
manuscript_section: Results → system-level performance (external)

core_conclusion: >-
  On 301 KNHANES pairs the agent reaches F1 0.375 against 0.360 for its own
  deterministic rule layer and 0.176 / 0.173 / 0.120 for LightRAG, a pure LLM and
  naive RAG. Removing the 5 pairs whose rules were revised after the first
  confirmatory run leaves 296 pairs on which every method loses about two thirds
  of its F1, with the ordering intact (0.211 / 0.200 / 0.122 / 0.089 / 0.086).
  The gain is precision, not recall: agent and rule layer both recall 0.50 of
  replicated pairs. In the development matrix all 6 replicated pairs sit on
  revised rules, so that matrix contributes no out-of-sample estimate.

archetype: quantitative_grid

panels:
  - id: panel_a_external_f1
    role: primary
    layout: half_width
    title: "a  External F1, with and without revision-touched pairs"
    content: >-
      Grouped bars, five methods × two scopes. All 301 pairs: agent 0.375, rule
      layer 0.360, LightRAG 0.176, pure LLM 0.173, naive RAG 0.120. Revision-free
      296 pairs: 0.211, 0.200, 0.089, 0.122, 0.086.
    plot_type: grouped_bar
    x_axis: method
    y_axis: F1 on KNHANES pairs
    annotations:
      - "baselines: mean over five seeds; agent and rule layer deterministic"
      - "F1 is the declared metric; accuracy McNemar is reported separately"

  - id: panel_b_gate_decisions
    role: supporting
    layout: half_width
    title: "b  Who decides: gates, not the language model"
    content: >-
      Horizontal bars over the 474 pairs of the fused run: no rule fires 418,
      evidence at B or above 45, LLM arbiter 6, negative-control abstention 3,
      no relevant evidence 2.
    plot_type: bar
    x_axis: pairs
    y_axis: decision layer

  - id: panel_c_provenance
    role: supporting
    layout: half_width
    title: "c  Where the positives come from"
    content: >-
      Stacked horizontal bars of replicated pairs by provenance. NHANES
      (development): 6 replicated, all on revised rules, 0 clean. KNHANES
      (external): 18 replicated, 5 on revised rules, 13 clean.
    plot_type: stacked_bar
    x_axis: replicated pairs
    y_axis: matrix

  - id: panel_d_three_state
    role: supporting
    layout: half_width
    title: "d  Three-state decomposition (KNHANES 301)"
    content: >-
      Grouped bars for agent and rule layer: recall on replicated pairs (0.50
      each), flag rate on contradicted pairs (0.17 each) and flag rate on
      uninformative pairs (0.07 versus 0.08).
    plot_type: grouped_bar
    x_axis: gold state
    y_axis: proportion of pairs

backend:
  value: python
  lock: true
  fallback_policy: stop_and_report

dependencies:
  - matplotlib >= 3.7
  - numpy
  - pandas

export:
  dimensions_mm: [180, 138]
  dpi: 600
  formats: [svg, pdf, tiff, png]
