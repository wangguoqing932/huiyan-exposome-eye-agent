# Figure contract: Figure 2 — 慧眼 vs three baselines, scored against the R11 gold
# Project: huiyan (慧眼)
#
# REVISION R11 (2026-10-15). What changed and why:
#   * All numbers re-scored against the R11-corrected gold (variable_map v2,
#     17 operationalisation corrections). Source of truth:
#     outputs/baseline_summary_R11_corrected_gold.json — the frozen R5
#     predictions scored against the R11 gold.
#   * plot_type switched from `bar_with_error_bars` to `forest`. The renderer
#     (medical-agent-writer/scripts/build_figures.py) implements only
#     grouped_bar / forest / heatmap / scatter / horizontal_bar / stacked_bar /
#     network; the previous type would have rendered a BLANK placeholder.
#     `forest` also aggregates per-seed rows to mean ± SD by label, which is
#     exactly what a multi-seed bar chart needs.
#   * OPEN ITEM (must be resolved before this figure is final): the mandatory
#     v1.1 dual-report bar currently carries an R5-gold number (F1=0.111). The
#     v1.1 ruleset snapshot is not in the working tree; it is recoverable from
#     git commit 1c4e193:configs/rules.yaml (the commit before 9a92b61
#     introduced v1.2). Until the replay is recomputed on the R11 gold, the bar
#     is labelled as R5-gold and must not be compared head-to-head with the
#     R11-gold methods.

figure_id: figure2_performance
title: "慧眼 (v1.2) vs three LLM baselines on NHANES pairs, scored against the R11-corrected gold (5 seeds)"
figure_number: 2
manuscript_section: Results → system-level performance

core_conclusion: >-
  Against the R11-corrected three-state gold (survey svyglm variance), the full
  慧眼 system attains F1 = 0.435 (P 0.294 / R 0.833, deterministic across
  seeds), ahead of lightrag 0.327 ± 0.005, pure_llm 0.301 ± 0.017 and naive_rag
  0.080 ± 0.089 (5 seeds each). Paired McNemar is significant against pure_llm
  (p = 0.0043–0.0118) and naive_rag (p = 0.00024–0.0129) but NOT against
  lightrag (p = 0.057–0.092). The precision of every method is low (0.10–0.29)
  because most predicted-positive pairs are uninformative under the
  three-state standard rather than contradicting it. The pre-expansion v1.1
  ruleset scored 0.111 on the R5 gold; that bar is shown for the mandatory dual
  report but is on a different gold and is labelled as such.

archetype: quantitative_grid

panels:
  - id: panel_a_f1_by_method
    role: primary
    layout: full_width
    title: "F1 by method (5 seeds, mean ± SD); R11-corrected gold"
    content: >-
      Forest plot of per-seed F1 aggregated to mean ± SD per method. Order:
      full_system 0.435 (deterministic) > lightrag 0.327 > pure_llm 0.301 >
      naive_rag 0.080. A separately labelled row for full_system_v1.1_replay
      (0.111) is present in the source CSV but is on the R5 gold.
    plot_type: forest
    x_axis: mean ± SD across seeds
    annotations:
      - "5 seeds [11,22,33,44,55]; full_system is deterministic (all seeds identical)"
      - "McNemar vs pure_llm p=0.0043-0.0118 (*), vs naive_rag p=0.00024-0.0129 (*), vs lightrag p=0.057-0.092 (n.s.)"
      - "v1.1 replay = 0.111 on the R5 gold (different denominator) — dual report, not a like-for-like bar"

backend:
  value: python
  lock: true
  fallback_policy: stop_and_report
dependencies:
  - matplotlib >= 3.7
  - numpy

export:
  dimensions_mm: [180, 90]
  dpi: 600
  formats: [svg, pdf, tiff, png]
  editable_text: true
  svg_fonttype: none
  pdf_fonttype: 42
  font_type: arial
  font_size_range_pt: [6, 11]
  color_mode: cmyk_friendly

style:
  theme: nmi_pastel
  font_family: Arial
  font_size_pt: 7
  axes_linewidth: 0.8

color_palette:
  name: NMI_pastel
  methods:
    full_system: "#5B8FF9"
    full_system_v1.1_replay: "#5B8FF9"
    lightrag: "#5AD8A6"
    pure_llm: "#B8B8B8"
    naive_rag: "#9D2933"

source_data:
  csv_path: outputs/figures/source_data/figure2_performance.csv
  schema:
    - column: method
      values: [full_system, pure_llm, lightrag, naive_rag, full_system_v1.1_replay]
    - column: dataset
      values: [NHANES]
    - column: seed
    - column: F1
    - column: estimate
    - column: ci_low
    - column: ci_high
    - column: P
    - column: R
    - column: ruleset
  # Supporting (non-panel) sources, kept as comments because
  # source_data.additionalProperties is false in figure_contract.schema.json —
  # writing them as `additional_files` was a pre-existing schema violation that
  # made this contract unloadable:
  #   outputs/baseline_summary_R11_corrected_gold.json
  #   outputs/confirmatory/v11_replay_R5.json
  #   outputs/baseline_predictions.jsonl

review_risks:
  - id: v11_replay_gold_mismatch
    risk: "the v1.1 dual-report bar is an R5-gold number while every other bar is R11-gold"
    mitigation: "label the row explicitly as R5-gold; recompute from git 1c4e193:configs/rules.yaml before submission, or drop the bar and keep the v1.1 comparison in text only"
  - id: n_vs_lightrag
    risk: "full_system vs lightrag is NOT significant (p=0.057-0.092)"
    mitigation: "mark n.s. explicitly; superiority claims only against pure_llm / naive_rag"
  - id: low_precision_all_methods
    risk: "precision 0.10-0.29 for every method; the system's advantage is in recall, not precision"
    mitigation: "state that most predicted-positive pairs are uninformative under the three-state standard, not contradicted"
  - id: gold_revision
    risk: "scoring against a gold that was itself revised in R11 could be read as tuning"
    mitigation: "predictions are the frozen R5 outputs; only the gold changed, and both scorings are published side by side"

legend:
  position: below
  font_size_pt: 7
  items:
    - "NHANES tested pairs; gold = three-state labels under survey svyglm variance after the R11 operationalisation corrections"
    - "5 seeds per method; full_system is deterministic and all five runs are identical"
    - "Paired McNemar exact; * p<0.05; n.s. p>=0.057 (vs lightrag)"
    - "v1.1 replay row is scored on the R5 gold and is not like-for-like with the R11-gold bars"

accessibility:
  alt_text: >-
    Forest plot of F1 per method on NHANES pairs under the R11-corrected gold:
    full 慧眼 0.435, lightrag 0.327, pure_llm 0.301, naive_rag 0.080, with a
    separately labelled pre-expansion v1.1 replay row at 0.111 that is scored on
    a different gold.
  color_blind_safe: true
