# Figure contract: Figure 5 — Reasoning Trace
# Consumed by nature-figure skill.
# Project: huiyan (慧眼)

figure_id: figure5_reasoning_trace
title: "Step-by-step reasoning trace across the three architectural layers"
figure_number: S2
manuscript_section: Results → Interpretability / Supplementary

core_conclusion: >-
  慧眼's three-layer architecture produces a fully
  traceable reasoning chain — each transition from rule signal to KG path to
  LLM arbitration is logged, enabling post-hoc audit of every output.

archetype: schematic_led_composite

panels:
  - id: panel_a_trace_flow
    role: primary
    layout_template: hero_schematic_with_quant_row
    layout: full_width_top
    title: "Seven-step reasoning trace"
    content: >-
      Horizontal swim-lane diagram with three lanes (Rule Engine, LightRAG KG,
      LLM Arbiter / Report). Seven logged steps are numbered in execution
      order: normalise A, normalise B, match r04, cross-cover r03 (rule lane);
      KG retrieval (KG lane); risk grade and report + trace (arbiter lane).
      The step list is the logged trace, not a reconstruction, and no latency
      panel is drawn because per-layer timings were never logged.
    plot_type: swimlane
    visual_elements:
      - type: swimlane
        lanes: [Rule Engine, LightRAG KG, LLM Arbiter / Report]
        nodes:
          - {lane: Rule Engine, step: 1, label: "Normalise A"}
          - {lane: Rule Engine, step: 2, label: "Normalise B"}
          - {lane: Rule Engine, step: 3, label: "Match r04"}
          - {lane: Rule Engine, step: 4, label: "Cross-cover r03"}
          - {lane: LightRAG KG, step: 5, label: "KG retrieval"}
          - {lane: LLM Arbiter / Report, step: 6, label: "Risk grade"}
          - {lane: LLM Arbiter / Report, step: 7, label: "Report + trace"}

  - id: panel_b_kg_path
    role: supporting
    layout_template: asymmetric_hero_panel
    layout: bottom_left
    title: "Knowledge-graph path"
    content: >-
      Chain from HbA1c to PDR through hyperglycaemia, retinal ischaemia, VEGF
      upregulation and neovascularisation. Rule r04 covers the full chain; the
      chain is drawn from figure5_paths.csv.
    plot_type: pathway_chain
    nodes: [hba1c, hyperglycaemia, retinal_ischaemia, VEGF_upregulation,
            neovascularisation, dr_pdr]
    edges_from: outputs/figures/source_data/figure5_paths.csv

  - id: panel_c_steps_per_layer
    role: supporting
    layout_template: asymmetric_hero_panel
    layout: bottom_right
    title: "Steps per layer"
    content: >-
      Count of logged steps per architectural layer: Rule 4, KG 1, Arbiter 2.
      Derived by grouping figure5_reasoning_trace.csv by layer; it shows which
      layer carries the reasoning burden without inventing timing data.
    plot_type: bar
    x_axis: logged steps
    y_axis: layer

backend:
  value: python
  lock: true
  fallback_policy: stop_and_report
dependencies:
  - matplotlib >= 3.7
  - networkx >= 3.0
  - numpy

export:
  dimensions_mm: [180, 120]
  dpi: 600
  formats: [svg, pdf, tiff, png]
  editable_text: true
  svg_fonttype: none           # keep <text> nodes editable (v2.5)
  pdf_fonttype: 42             # TrueType editable text (v2.5)
  font_type: arial
  font_size_range_pt: [6, 11]
  line_width_range_pt: [0.5, 1.2]
  color_mode: cmyk_friendly

# ─────────────────────────────────────────────────────────────
# STYLE (v2.5) — locks theme + rcParams at the contract layer.
# The renderer (medical-agent-writer/scripts/figure_style.py) reads
# style.theme and applies the matching PALETTE + rcParams.
# ─────────────────────────────────────────────────────────────
style:
  theme: nmi_pastel
  font_family: Arial
  font_size_pt: 7
  axes_linewidth: 0.8

color_palette:
  name: NMI_pastel
  lanes:
    rule: "#5B8FF9"        # blue
    kg: "#5AD8A6"          # green
    llm: "#F6BD16"         # amber
  severity:
    high: "#dc2626"
    medium: "#ea580c"
    low: "#16a34a"
    unknown: "#6b7280"
  network_nodes:
    entity_a: "#5B8FF9"
    entity_b: "#5AD8A6"
    gene: "#F6BD16"
    pathway: "#9D2933"
    disease: "#722ED1"
  note: >-
    Lane colors match Figure 1 layer colors for visual consistency across
    the manuscript.

source_data:
  csv_path: outputs/figures/source_data/figure5_reasoning_trace.csv
  secondary_csv:
    path: outputs/figures/source_data/figure5_paths.csv
    schema:
      - column: source_node
      - column: target_node
      - column: edge_type
  schema:
    - column: case_id
    - column: step_id
    - column: layer
      values: [rule_engine, lightrag_kg, llm_arbiter]
    - column: step_label
    - column: duration_ms
    - column: input_summary
    - column: output_summary
  secondary_csv:
    path: outputs/figures/source_data/figure5_paths.csv
    schema:
      - column: source_node
      - column: target_node
      - column: weight
      - column: path_type

review_risks:
  - id: trace_too_detailed
    risk: "Showing every token-level decision overwhelms readers"
    mitigation: "Show only decision points; aggregate repeated LLM retries"
  - id: privacy_of_prompts
    risk: "Prompts may contain PHI-adjacent text"
    mitigation: "Use synthetic case for figure; redact any real patient references"
  - id: latency_overemphasis
    risk: "Latency breakdown may make system look slow vs baselines"
    mitigation: "Frame as 'transparent cost of interpretability'; note batch mode amortizes"

legend:
  position: below
  font_size_pt: 7
  items:
    - "Swim-lane colors correspond to architectural layers (per Figure 1)"
    - "Durations are median across intval-nhanes cases (n 以 .executor/progress.json 为准)"
    - "第二客户端升档仅作用于最高严重度档位（DualLLMClient；未配置 GPT 端点）"

accessibility:
  alt_text: >-
    Three-panel figure showing reasoning swim-lanes, latency breakdown, and
    knowledge-graph path network for a demo case.
  color_blind_safe: true

disposition: withdrawn
withdrawn_reason: >
  Panels contained only the renderer's placeholder text. Not
  rendered, and not needed for the cohort-layer argument. Retained
  here so the placeholder scan keeps reporting it.
