rule_testability:
- rule: r07_vitamind_x_dr_npdr
  status: untestable_with_current_data
  reason: NHANES 本机副本缺 VID 模块(LBXVIDMS 不存在)，无法构造 25(OH)D； KNHANES 血清维生素D(HE_vitD)仅 2008-2012，而 DR 分级(E_DM_r/l 的 1/2/3 级) 仅
    2016-2021 —— 两个窗口不重叠。
  remedies: '① 补下载 NHANES 2005-2006 VID_D.XPT / 2007-2008 VID_E.XPT； ② 或用 KNHANES 膳食维生素D(N_VITD, 2016+) 作不同构念的敏感性分析。

    '
- rule: r09_mediterranean_diet_x_amd_late
  status: not_yet_built
  reason: 需自建地中海饮食依从性指数；原始 FFQ/24h recall 数据已在(hn12-hn16_ffq, hnYY_24rc)，但指数权重与切点尚未预注册。
- rule: r19_proinflam_diet_x_dr_npdr
  status: not_yet_built
  reason: 需自建 DII(膳食炎症指数)；Shivappa 2014 标准权重是外生的，符合本表纪律，尚未实现。
- rule: r18_uv_x_cataract
  status: untestable_with_current_data
  reason: KNHANES 日照暴露(E_Q_SUN)仅 2010-2012；而白内障自报 DH2_lt 仅 2008-2009、 DH2_dg 仅 2008-2009 与 2017-2021 —— 无重叠 wave。E_Q_SUN 的取值编码
    (1/2/3)也未在码本中确证。
- rule: r21_pm25_x_vi_mod_severe
  status: untestable_construct_mismatch
  reason: KNHANES 视力障碍仅有 E_VS_DS 二值"任意视力障碍"(2008-2012，阳性仅 226)， 没有轻/中/重分级。规则针对 moderate/severe，属于构念错配，不得用二值变量顶替 (这正是原实现 vision_impairment_moderate
    = E_VS_DS 的错误)。
rule_downgrades:
- rule: r22_bmi_x_retinopathy
  action: must_leave_headline
  reason: rationale 自述"NHANES 确证(OR≈1.47)方向一致，规则纳入属数据驱动的探索性扩展" —— 即看到内部验证结果后新增，随后又参与内部验证指标。属测试集泄漏。
  options: ① 从 headline 剔除、单独作为探索性发现报告；② 冻结规则集后重跑全部层。
